name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Tests
        # No TYPESAFE_API_KEY: the suite must never need the network.
        run: pytest -q
      - name: Baselines still run standalone
        run: python3 lab/baselines.py
      - name: Demo payloads still build
        run: python3 lab/run_demos.py --dry-run > /dev/null
      - name: Dataset controls still hold
        run: |
          python3 lab/tiers/baselines.py
          python3 lab/domains/baselines.py
      - name: Experiments still size themselves without a credential
        run: |
          python3 lab/run_tiers.py --dry-run > /dev/null
          python3 lab/probe_structure.py --dry-run > /dev/null
          python3 lab/exp_circularity.py --dry-run > /dev/null
          python3 lab/exp_transfer.py --dry-run > /dev/null
          python3 lab/exp_headtohead.py --dry-run > /dev/null
      - name: Offline analyses still reproduce
        run: |
          python3 analysis/circularity.py > /dev/null
          python3 analysis/quantisation.py > /dev/null
          python3 analysis/calibration_transfer.py > /dev/null
          python3 analysis/calibration_set_size.py --draws 5 > /dev/null
      - name: Raw-data provenance
        # Not --strict yet: four runs on main predate the rule being enforced.
        # analysis/provenance.py names them; switch to --strict once they land.
        run: python3 analysis/provenance.py
