name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Tests
        # No TYPESAFE_API_KEY: the suite must never need the network.
        run: pytest -q
      - name: Baselines still run standalone
        run: python3 lab/baselines.py
      - name: Demo payloads still build
        run: python3 lab/run_demos.py --dry-run > /dev/null
